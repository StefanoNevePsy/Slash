name: Build & Release

# Every push to main builds Slash.app and publishes it as a new GitHub Release.
# The app checks the latest release and updates itself.
# You can also start it by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: v
        run: |
          MAJOR_MINOR=$(cat VERSION | tr -d '[:space:]')
          echo "version=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh "${{ steps.v.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Slash ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: build/Slash.zip
